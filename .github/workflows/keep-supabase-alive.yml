name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 0 * * *' # daily at 00:00 UTC
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://jghulxdxkrzlvwyjseme.supabase.co/rest/v1/inquiries?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          echo "Supabase responded with HTTP $status"
          if [ "$status" -ge 500 ] || [ "$status" -eq 000 ]; then
            echo "Unexpected response from Supabase"
            exit 1
          fi
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
